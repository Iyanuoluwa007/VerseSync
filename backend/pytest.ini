[pytest]
testpaths = tests
# `auto` means async test functions are collected without decorating every
# one of them. The OBS client and event hub are async end to end, so this
# keeps their tests readable.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:app.*
# Deliberately NOT -q: a caller running `pytest -q` would then get
# -qq, which suppresses the pass/fail summary line altogether.
addopts = --strict-markers
